<!doctype html>
<!-- build: v27 -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SMV Power Viz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style_v27.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">FREE</div>
        <div class="text">
          <h1>sMV POWER VIZ </h1>
          <p>** Pick System Audio Source-return to this Tab **</p>
        </div>
      </div>

      <div class="controls">
        <label class="btn">
          <input id="file" type="file" accept="audio/*" />
          Load audio
        </label>
        <button id="play" class="btn" type="button" disabled>Play</button>
        <button id="mic" class="btn" type="button">Mic</button>
        <button id="sys" class="btn" type="button">System Audio</button>

        <div class="layers" id="layers">
          <button class="layer-btn" data-layer="wave" aria-pressed="true">Wave</button>
          <button class="layer-btn" data-layer="blocks" aria-pressed="false">Blocks</button>
          <button class="layer-btn" data-layer="radiate" aria-pressed="false">Radiate</button>
          <button class="layer-btn" data-layer="flow" aria-pressed="false">Flow</button>
          <button class="layer-btn" data-layer="orbit" aria-pressed="false">Orbit</button>
          <button class="layer-btn" data-layer="cymatic" aria-pressed="false">Cymatic</button>
          <button class="layer-btn" data-layer="logos" aria-pressed="false">SMV Logos</button>
        </div>
      </div>
    </header>

    <main class="stage" id="stage">
      <canvas id="c"></canvas>
    </main>

    <section class="control-panel" id="controlPanel" aria-label="Visualizer control panel">
      <div class="panel-header">Visualizer Control Panel</div>

      <label class="control-row">
        <span>Viz Method</span>
        <select id="vizMethod" class="panel-select">
          <option value="custom">Custom (layer buttons)</option>
          <option value="cymatic">Cymatic Focus</option>
          <option value="orbital">Orbital Pulse</option>
          <option value="bars">Bars + Wave</option>
          <option value="full">Full Stack</option>
          <option value="logos">SMV Logo Wall</option>
        </select>
      </label>


      <label class="control-row">
        <span>Logo Style</span>
        <select id="logoStyle" class="panel-select">
          <option value="square">SMV Square</option>
          <option value="crest">Power Viz Crest</option>
          <option value="mix">Mixed</option>
          <option value="uploaded">Uploaded Image</option>
        </select>
      </label>


      <label class="control-row">
        <span>Upload Image</span>
        <input id="logoImage" class="panel-file" type="file" accept="image/*" />
        <output id="logoImageState">none</output>
      </label>


      <label class="control-row">
        <span>Image Filter</span>
        <select id="imageFilter" class="panel-select">
          <option value="balanced">Balanced</option>
          <option value="natural">Natural</option>
          <option value="vivid">Vivid</option>
          <option value="mono">Mono</option>
          <option value="contrast">High Contrast</option>
        </select>
      </label>

      <label class="control-row">
        <span>Filter Mix</span>
        <input id="imageFilterMix" type="range" min="0" max="1" value="0.55" step="0.01" />
        <output id="imageFilterMixVal">0.55</output>
      </label>

      <label class="control-row">
        <span>Hue</span>
        <input id="hueShift" type="range" min="-180" max="180" value="0" step="1" />
        <output id="hueShiftVal">0</output>
      </label>

      <label class="control-row">
        <span>Excitement</span>
        <input id="excitement" type="range" min="0.5" max="2.0" value="1.0" step="0.01" />
        <output id="excitementVal">1.00</output>
      </label>

      <label class="control-row">
        <span>Shape Band Sizer</span>
        <input id="shapeBand" type="range" min="0.6" max="2.5" value="1.0" step="0.01" />
        <output id="shapeBandVal">1.00</output>
      </label>

      <label class="control-row">
        <span>Amplitude</span>
        <input id="amplitude" type="range" min="0.4" max="2.4" value="1.0" step="0.01" />
        <output id="amplitudeVal">1.00</output>
      </label>

      <label class="control-row">
        <span>Period</span>
        <input id="period" type="range" min="0.4" max="2.4" value="1.0" step="0.01" />
        <output id="periodVal">1.00</output>
      </label>
    </section>

    <audio id="audio" crossorigin="anonymous"></audio>
  </div>
  <script src="app_v27.js"></script>
</body>
</html>
