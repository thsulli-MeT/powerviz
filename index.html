<!doctype html>
<!-- build: 2026-01-29-v13 -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SMV Visualizer – Canvas 5-mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css?v=13" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">SMV</div>
        <div class="text">
          <h1>SMV Visualizer</h1>
          <p>Canvas renderer • 5 modes • auto switching</p>
        </div>
      </div>

      <div class="controls">
        <label class="btn">
          <input id="file" type="file" accept="audio/*" />
          Load audio
        </label>
        <button id="play" class="btn" type="button" disabled>Play</button>
        <button id="mic" class="btn" type="button">Mic</button>
        <button id="tab" class="btn" type="button">Capture Tab</button>

        
        <div class="layers" id="layers">
          <button class="layer-btn" data-layer="auto" aria-pressed="true">Auto</button>
          <button class="layer-btn" data-layer="wave" aria-pressed="false">Wave</button>
          <button class="layer-btn" data-layer="blocks" aria-pressed="false">Blocks</button>
          <button class="layer-btn" data-layer="radiate" aria-pressed="false">Radiate</button>
          <button class="layer-btn" data-layer="flow" aria-pressed="false">Flow</button>
          <button class="layer-btn" data-layer="orbit" aria-pressed="false">Orbit</button>
        </div>

      </div>
    </header>

    <main class="stage" id="stage">
      <canvas id="c"></canvas>
    </main>

    <footer class="footer">SMV • canvas test</footer>
  </div>

  <audio id="audio" crossorigin="anonymous"></audio>
  <script src="app.js?v=13"></script>
</body>
</html>
