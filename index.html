<!doctype html>
<!-- build: 2026-01-29-v18 -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SMV PowerViz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css?v=18" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">SMV</div>
        <div class="text">
          <h1>PowerViz</h1>
          <p>Wave starts instantly • load file / mic / system audio</p>
        </div>
      </div>

      <div class="controls">
        <label class="btn">
          <input id="file" type="file" accept="audio/*" />
          Load audio
        </label>
        <button id="play" class="btn" type="button" disabled>Play</button>
        <button id="mic" class="btn" type="button">Mic</button>
        <button id="sys" class="btn" type="button">System Audio</button>

        <div class="layers">
          <button class="layer-btn" data-layer="wave" aria-pressed="true">Wave</button>
          <button class="layer-btn" data-layer="blocks" aria-pressed="false">Blocks</button>
          <button class="layer-btn" data-layer="radiate" aria-pressed="false">Radiate</button>
          <button class="layer-btn" data-layer="flow" aria-pressed="false">Flow</button>
          <button class="layer-btn" data-layer="orbit" aria-pressed="false">Orbit</button>
        </div>
      </div>
    </header>

    <main class="stage">
      <canvas id="c"></canvas>
      <div id="err" class="err" hidden></div>
    </main>

    <footer class="footer">SMV</footer>
  </div>

  <audio id="audio" crossorigin="anonymous"></audio>
  <script src="app.js?v=18"></script>
</body>
</html>
